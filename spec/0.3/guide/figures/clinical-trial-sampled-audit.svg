<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>Sampled source-data audit: selected sites and the error-rate bound</title>
  <rect width="840" height="330" fill="#ffffff"/>

  <!-- Left panel: sampled sites -->
  <g transform="translate(20,0)">
    <rect x="0" y="10" width="390" height="310" fill="#f7f9fb" stroke="#c9d3dc"/>
    <text x="195" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Sampling plan</text>
    <text x="195" y="56" text-anchor="middle" font-size="12" fill="#555">sites by probability proportional to enrolment</text>
    <rect x="72" y="78" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="108" y="78" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="144" y="78" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="180" y="78" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="216" y="78" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="252" y="78" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="288" y="78" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="72" y="110" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="108" y="110" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="144" y="110" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="180" y="110" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="216" y="110" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="252" y="110" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="288" y="110" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="72" y="142" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="108" y="142" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="144" y="142" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="180" y="142" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="216" y="142" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="252" y="142" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="288" y="142" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="72" y="174" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="108" y="174" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="144" y="174" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="180" y="174" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="216" y="174" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="252" y="174" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="288" y="174" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="72" y="206" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="108" y="206" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="144" y="206" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="180" y="206" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="216" y="206" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="252" y="206" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="288" y="206" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="72" y="238" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="108" y="238" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="144" y="238" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="180" y="238" width="28" height="24" rx="3" fill="#33506b"/>
    <rect x="216" y="238" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="252" y="238" width="28" height="24" rx="3" fill="#ffffff" stroke="#9aa9b8"/>
    <rect x="40" y="276" width="14" height="12" rx="2" fill="#33506b"/>
    <text x="60" y="287" font-size="12" fill="#222">audited site (8)</text>
    <rect x="190" y="276" width="14" height="12" rx="2" fill="#ffffff" stroke="#9aa9b8"/>
    <text x="210" y="287" font-size="12" fill="#222">not audited (33)</text>
    <text x="195" y="309" text-anchor="middle" font-size="12" fill="#222">60 subjects × 80 critical data points = 4,800</text>
  </g>

  <!-- Right panel: estimate and bound -->
  <g>
    <rect x="430" y="10" width="390" height="310" fill="#f7f9fb" stroke="#c9d3dc"/>
    <text x="625" y="36" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Critical-field error rate</text>
    <text x="625" y="56" text-anchor="middle" font-size="12" fill="#555">7 discrepancies in 4,800 audited data points</text>

    <rect x="470" y="160" width="136.9" height="20" fill="#9fc3e0"/>
    <line x1="470" y1="186" x2="770" y2="186" stroke="#555" stroke-width="1.5"/>
    <line x1="470" y1="186" x2="470" y2="192" stroke="#555"/>
    <text x="470" y="208" text-anchor="middle" font-size="11" fill="#555">0.0 %</text>
    <line x1="520" y1="186" x2="520" y2="192" stroke="#555"/>
    <text x="520" y="208" text-anchor="middle" font-size="11" fill="#555">0.1 %</text>
    <line x1="570" y1="186" x2="570" y2="192" stroke="#555"/>
    <text x="570" y="208" text-anchor="middle" font-size="11" fill="#555">0.2 %</text>
    <line x1="620" y1="186" x2="620" y2="192" stroke="#555"/>
    <text x="620" y="208" text-anchor="middle" font-size="11" fill="#555">0.3 %</text>
    <line x1="670" y1="186" x2="670" y2="192" stroke="#555"/>
    <text x="670" y="208" text-anchor="middle" font-size="11" fill="#555">0.4 %</text>
    <line x1="720" y1="186" x2="720" y2="192" stroke="#555"/>
    <text x="720" y="208" text-anchor="middle" font-size="11" fill="#555">0.5 %</text>
    <line x1="770" y1="186" x2="770" y2="192" stroke="#555"/>
    <text x="770" y="208" text-anchor="middle" font-size="11" fill="#555">0.6 %</text>

    <line x1="543.0" y1="150" x2="543.0" y2="186" stroke="#33506b" stroke-width="3"/>
    <text x="543.0" y="142" text-anchor="middle" font-size="12" fill="#33506b">observed 0.146 %</text>

    <line x1="606.9" y1="110" x2="606.9" y2="186" stroke="#1f5f99" stroke-width="3"/>
    <text x="606.9" y="102" text-anchor="middle" font-size="12" fill="#1f5f99" font-weight="bold">95 % upper bound 0.274 %</text>

    <line x1="720.0" y1="80" x2="720.0" y2="186" stroke="#b03030" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="720.0" y="74" text-anchor="middle" font-size="12" fill="#b03030">profile maximum 0.5 %</text>

    <text x="450" y="244" font-size="12" fill="#222">Shaded: one-sided 95 % confidence interval for</text>
    <text x="450" y="262" font-size="12" fill="#222">the error rate (exact Clopper–Pearson method).</text>
    <text x="450" y="290" font-size="12" fill="#2a6a2a">✓ The bound, not the estimate, is compared:</text>
    <text x="450" y="308" font-size="12" fill="#2a6a2a">0.002738 ≤ 0.005</text>
  </g>
</svg>
